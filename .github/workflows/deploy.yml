name: Deploy
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Sync
        timeout-minutes: 15
        run: |
          #!/bin/bash
          set -e
          echo "🚀 Начинаем синхронизацию данных волонтёров..."
          # Функция для получения URL из frontmatter (простая строка)
          get_repo_url() {
            local file=$1
            if [ ! -f "$file" ]; then
              echo "  ❌ Файл не найден: $file"
              return 1
            fi
            # Ищем строку вида "repositories: 'https://...'" или "repositories: https://..."
            grep -E "^repositories:[[:space:]]*['\"]?https?://" "$file" | \
              head -1 | \
              sed -E "s/^repositories:[[:space:]]*['\"]?//" | \
              sed -E "s/['\"]?[[:space:]]*$//" | \
              tr -d ' '
          }
          # Функция для безопасного клонирования/обновления
          clone_or_update() {
            local repo_url=$1
            local target_dir=$2
            local label=$3
            [ -z "$repo_url" ] && { echo "  ⚠️ URL для $label не указан"; return 0; }
            if [ -d "$target_dir" ]; then
              if [ -d "$target_dir/.git" ]; then
                echo "  🔄 Обновление $label: $target_dir"
                git -C "$target_dir" pull --ff-only 2>/dev/null || {
                  echo "  ⚠️ Сброс изменений в $label"
                  git -C "$target_dir" fetch --all 2>/dev/null || true
                  git -C "$target_dir" reset --hard origin/main 2>/dev/null || \
                  git -C "$target_dir" reset --hard origin/master 2>/dev/null
                }
              else
                rm -rf "$target_dir"
                git clone --depth 1 "$repo_url" "$target_dir"
              fi
            else
              echo "  📥 Клонирование $label: $repo_url"
              git clone --depth 1 "$repo_url" "$target_dir"
            fi
          }
          # ⭐ Ищем MD-файлы волонтёров
          find . -path "*/humans/volunteers/*.md" -type f | while read -r file; do
            # Язык из пути (./ru/humans/volunteers/ivan.md → ru)
            lang=$(echo "$file" | cut -d'/' -f2)
            # UUID волонтёра
            uuid=$(grep -E "^uuid:[[:space:]]*" "$file" | head -1 | sed -E "s/^uuid:[[:space:]]*['\"]?//" | sed -E "s/['\"]?[[:space:]]*$//" | tr -d ' ')
            if [ -z "$uuid" ]; then
              echo "  ⚠️ UUID не найден в $file, пропускаем"
              continue
            fi
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "👤 Волонтёр: $uuid ($lang)"
            echo "📄 Файл: $file"
            # ⭐ Одна ссылка на репозиторий
            repo_url=$(get_repo_url "$file")
            if [ -z "$repo_url" ]; then
              echo "  ⚠️ Ссылка на репозиторий не найдена, пропускаем"
              continue
            fi
            # ⭐ Клонируем в {lang}/pets/{uuid}
            target_dir="${lang}/pets/${uuid}"
            mkdir -p "$target_dir"
            echo "  🔗 Репозиторий: $repo_url"
            echo "  📁 Куда: $target_dir"
            clone_or_update "$repo_url" "$target_dir" "volunteer-${uuid}-${lang}"
          done
          echo ""
          echo "✅ Синхронизация завершена!"
      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: |
            .vitepress/cache
            node_modules/.vite
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-vitepress-
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate JSON data
        run: npm run generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build with VitePress
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: sync-and-build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  notify-failure:
    needs: deploy
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Ошибка деплоя',
              body: `## Деплой упал\n\n**Время:** ${new Date().toISOString()}\n\n**[Смотреть логи](${runUrl})**\n\n### Что делать:\n1. Проверить логи\n2. Исправить ошибку\n3. Запустить вручную: Actions → Deploy → Run workflow`
            });