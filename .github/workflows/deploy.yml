name: Deploy
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '23 0 * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Sync
        timeout-minutes: 15
        run: node tools/sync-md-data.js
      - name: Cache VitePress
        uses: actions/cache@v5
        with:
          path: |
            .vitepress/cache
            node_modules/.vite
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-vitepress-
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Generate JSON data
        run: npm run generate
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build with VitePress
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: sync-and-build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  notify-failure:
    needs: [sync-and-build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create or update issue on failure
        uses: actions/github-script@v8
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = '❌ Ошибка деплоя';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure'
            });
            const body = `## Деплой упал\n\n**Время:** ${new Date().toISOString()}\n\n**[Смотреть логи](${runUrl})**\n\n### Что делать:\n1. Проверить логи\n2. Исправить ошибку\n3. Запустить вручную: Actions → Deploy → Run workflow`;
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `🔁 **Повторное падение**\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['deploy-failure']
              });
            }